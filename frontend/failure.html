<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failure Center - Smart Toll Simulator</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .failure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .failure-grid button {
            width: 100%;
            height: 60px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">SmartToll Sim</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="vehicle.html">Vehicle Entry</a></li>
            <li><a href="payment.html">Payments</a></li>
            <li><a href="failure.html" class="active">Failure Center</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="system-design.html">System Design</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Failure Injection Center</h1>
            <p style="color: var(--text-muted);">Simulate system failures to test resilience</p>
        </header>

        <div class="card" style="margin-bottom: 20px;">
            <h3>Trigger System Failures</h3>
            <div class="failure-grid" style="margin-top: 15px;">
                <button class="btn btn-danger" onclick="simulateFailure('Invalid RFID')">Simulate RFID Failure</button>
                <button class="btn btn-danger" onclick="simulateFailure('Payment Gateway Down')">Simulate Payment Failure</button>
                <button class="btn btn-warning" onclick="simulateFailure('Network Delay')">Simulate Network Delay</button>
                <button class="btn btn-danger" onclick="simulateFailure('Server Error 500')">Simulate Server Error</button>
                <button class="btn btn-danger" onclick="simulateFailure('Database Connection Lost')">Simulate Database Failure</button>
                <button class="btn btn-danger" onclick="simulateFailure('Sensor Crash')">Simulate Sensor Failure</button>
                <button class="btn btn-warning" onclick="simulateFailure('Queue Delay')">Simulate Queue Delay</button>
                <button class="btn btn-warning" onclick="simulateFailure('Fraud Attempt Detected')">Simulate Fraud Attempt</button>
                <button class="btn btn-primary" onclick="simulateFailure('Camera Backup Triggered')">Simulate Camera Backup</button>
            </div>
        </div>

        <div class="card">
            <h3>Recent Failure Logs</h3>
            <table id="logs-table">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Vehicle</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS populated -->
                </tbody>
            </table>
        </div>
    </div>
    <div id="notification-container"></div>
    <script src="js/app.js"></script>
    <script src="js/failure.js"></script>
</body>
</html>
