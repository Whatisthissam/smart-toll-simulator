<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Toll Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="sidebar">
        <div class="logo">SmartToll Simulator</div>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="vehicle.html">Vehicle Entry</a></li>
            <li><a href="payment.html">Payments</a></li>
            <li><a href="failure.html">Failure Center</a></li>
            <li><a href="analytics.html">Analytics</a></li>
            <li><a href="system-design.html">System Design</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>System Overview</h1>
            <div id="system-status" class="badge badge-success">System Online</div>
        </header>

        <div class="dashboard-cards" id="dashboard-stats">
            <!-- Populated by JS -->
            <div class="card">
                <h3>Loading...</h3>
                <div class="value">-</div>
            </div>
        </div>

        <div class="split-layout">
            <div class="card">
                <h3>Recent Transactions</h3>
                <table id="recent-transactions">
                    <thead>
                        <tr>
                            <th>Vehicle</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h3>System Logs</h3>
                <table id="recent-logs">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="notification-container"></div>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
